name: Closing a pull request

on:
  pull_request_target:
    types:
      - closed

jobs:
  push:
    # Same group as deploy_doc in pull_request.yaml: both push to the
    # pull-request-deployments branch, and two pushes at once reject the second
    # ("fetch first"), failing that PR's preview deploy.
    concurrency:
      group: pull_request_versioned_doc
      cancel-in-progress: false
    uses: stakater/.github/.github/workflows/pull_request_closed.yaml@v0.0.221
    secrets:
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

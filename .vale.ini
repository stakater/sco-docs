StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/stakater/vale-package/releases/download/v0.0.104/Stakater.zip
Vocab = Stakater

# Only check MarkDown files
[*.md]

BasedOnStyles = Vale

# {{ screenshot: <name> }} resolves to an image path at build time and never reaches
# the reader. The name is a filename, so spelling and term rules do not apply.
TokenIgnores = (\{\{\s*screenshot:[^}]*\}\})

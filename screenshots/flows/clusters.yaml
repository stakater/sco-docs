# how-to-guides/user/provision-openshift-cluster.md and
# how-to-guides/user/connect-to-openshift-cluster.md -> 5 images.
#
# The list and detail shots need a real, long-lived cluster in the capture org
# (DOCS_CLUSTER_NAME, phase Ready). That was traded away once because a hosted control
# plane kept alive for two images was not worth it; the connect guide makes the detail
# page the thing the reader navigates by, so the cluster is now a capture requirement.
#
# The hosted-cluster-console-login shot opens the cluster's own console URL, outside the
# SCO console. For a private cluster that URL resolves only over the organisation mesh,
# so the runner host must be enrolled (netbird up against the CONSOLE_ORG default mesh)
# and a member of <cluster>-mesh-access before this flow runs. A public cluster needs
# nothing extra. The shot stops at the sign-in page: nothing is submitted.
#
# Read-only like the rest: the create form is filled and shot, never submitted.
name: sco-docs-clusters

requires:
  env:
    - CONSOLE_URL
    - CONSOLE_ORG
    - CONSOLE_USER
    - CONSOLE_PASSWORD
    - DOCS_CLUSTER_SIDEBAR_GROUP
    - DOCS_CLUSTER_PLURAL
    - DOCS_CLUSTER_NAME
    - DOCS_CLUSTER_CONSOLE_URL
  reachable: ["${CONSOLE_URL}", "${DOCS_CLUSTER_CONSOLE_URL}"]

viewport:
  width: 1280
  height: 800
  deviceScaleFactor: 2
  colorScheme: light

steps:
  - use: cloud-orchestrator-console-login
    with:
      portal: "${CONSOLE_URL}"
      org: "${CONSOLE_ORG}"
      username: "${CONSOLE_USER}"
      password: "${CONSOLE_PASSWORD}"

  # Both guides open with the list: where a reader finds the cluster they were handed.
  - use: cloud-orchestrator-console-open-resource-list
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_CLUSTER_PLURAL}"
  - use: cloud-orchestrator-console-expand-sidebar-group
    with:
      group: "${DOCS_CLUSTER_SIDEBAR_GROUP}"
  - { step: screenshot, path: cluster-list.png, fullPage: false }

  # The create form as it opens. Standard is the default in a fresh browser context and
  # nothing has toggled it yet, so this is a Standard shot without asserting it -- the
  # same assumption resources.yaml makes.
  - use: cloud-orchestrator-console-open-resource-create
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_CLUSTER_PLURAL}"
  - { step: fill, selector: 'input[id="metadata.name"], input#name', value: "my-cluster" }
  - { step: screenshot, path: cluster-create-standard.png, fullPage: false }

  # Advanced, framed on the END of the form. The top of the form is the same in both
  # modes -- Access and the default node pool are Standard fields -- so a shot taken
  # where the Standard one was shows nothing but a different toggle highlight. The
  # Advanced-only fields render further down, and the submit button is the one anchor
  # that is always last, whatever the spec adds above it.
  # Order matters: the mode persists in localStorage, so Standard had to be shot first.
  - use: cloud-orchestrator-console-set-complexity-mode
    with:
      mode: Advanced
  # Settle BEFORE scrolling, not after: aria-pressed flips first and the form re-renders
  # its fields a beat later, which resets the scroll position. A scroll issued in that
  # gap is undone before the screenshot, and the result is a second copy of the
  # Standard shot -- which is exactly what the first capture of this flow produced.
  - { step: wait, ms: 750 }
  - { step: scroll-to, selector: 'form button[type="submit"]', block: end }
  - { step: wait, ms: 500 }
  - { step: screenshot, path: cluster-create-advanced.png, fullPage: false }

  # Back to Standard before the detail shot, so the detail page reads the way a new
  # user sees it rather than inheriting the Advanced toggle from the form above.
  - use: cloud-orchestrator-console-set-complexity-mode
    with:
      mode: Standard
  - { step: wait, ms: 750 }

  # Step 1 of the connect guide, and Step 4 of the provision guide: the phase, console
  # URL and API endpoint the reader copies from. Needs DOCS_CLUSTER_NAME at phase Ready.
  - use: cloud-orchestrator-console-open-resource-detail
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_CLUSTER_PLURAL}"
      name: "${DOCS_CLUSTER_NAME}"
  - { step: screenshot, path: cluster-detail.png, fullPage: false }

  # Step 3 of the connect guide: the hosted cluster's console redirects straight to the
  # organisation sign-in page, with no identity-provider chooser. Shot at the sign-in
  # page and never submitted. Over the mesh when the cluster is private (see the note at
  # the top of this file).
  - { step: open, url: "${DOCS_CLUSTER_CONSOLE_URL}" }
  - { step: wait-for, selector: 'form', timeout: 60s }
  - { step: screenshot, path: hosted-cluster-console-login.png, fullPage: false }

after:
  - { step: screenshot, when: on-failure, path: _failure-clusters.png }

# how-to-guides/user/provision-openshift-cluster.md -> 2 images.
#
# Create-form only, and that is a cost decision rather than a design one: a list or
# detail shot needs a real cluster to exist in the capture org, and a hosted OpenShift
# cluster kept alive for two screenshots is not worth a control plane. The forms need
# nothing seeded, so this flow runs against any org.
#
# Read-only like the rest: the form is filled and shot, never submitted. Submitting it
# is what would provision the cluster this flow declines to require.
#
# `cluster-list` and `cluster-detail` are the images this leaves out. Add them here, and
# their directives back to the guide, if a long-lived cluster ever exists to point at.
name: sco-docs-clusters

requires:
  env:
    - CONSOLE_URL
    - CONSOLE_ORG
    - CONSOLE_USER
    - CONSOLE_PASSWORD
    - DOCS_CLUSTER_PLURAL
    - DOCS_CLUSTER_GROUPS_LABEL
  reachable: ["${CONSOLE_URL}"]

viewport:
  width: 1280
  height: 800
  deviceScaleFactor: 2
  colorScheme: light

steps:
  - use: cloud-orchestrator-console-login
    with:
      portal: "${CONSOLE_URL}"
      org: "${CONSOLE_ORG}"
      username: "${CONSOLE_USER}"
      password: "${CONSOLE_PASSWORD}"

  # The create form as it opens. Standard is the default in a fresh browser context and
  # nothing has toggled it yet, so this is a Standard shot without asserting it -- the
  # same assumption resources.yaml makes.
  - use: cloud-orchestrator-console-open-resource-create
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_CLUSTER_PLURAL}"
  - { step: fill, selector: "input#name", value: "my-cluster" }
  - { step: screenshot, path: cluster-create-standard.png, fullPage: false }

  # Advanced, framed on the access section -- the guide's step 2 is mostly about
  # networking mode and access.groups, and both live below the fold on a 800px viewport.
  # Order matters: the mode persists in localStorage, so Standard had to be shot first.
  - use: cloud-orchestrator-console-set-complexity-mode
    with:
      mode: Advanced
  # access.groups is an array of {name, role} objects, so it renders as an "Add <label>"
  # button over per-item cards, not as the pill input the members field uses. The button
  # is the anchor: it is the last thing in the section, so ending the scroll on it puts
  # the whole section in frame, and it fails by name if the label moves with the spec.
  - { step: scroll-to, selector: 'button:has-text("Add ${DOCS_CLUSTER_GROUPS_LABEL}")', block: end }
  - { step: wait, ms: 500 }
  - { step: screenshot, path: cluster-create-advanced.png, fullPage: false }

after:
  - { step: screenshot, when: on-failure, path: _failure-clusters.png }

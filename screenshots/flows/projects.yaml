# console/projects.md -> 2 images; how-to-guides/user/create-project.md -> 2 images.
# Projects are an ordinary resource, so the same two packs the resources flow uses
# cover this page with nothing but a different plural.
name: sco-docs-projects

requires:
  env:
    - CONSOLE_URL
    - CONSOLE_ORG
    - CONSOLE_USER
    - CONSOLE_PASSWORD
    - DOCS_PROJECT_PLURAL
    - DOCS_PROJECT_NAME
  reachable: ["${CONSOLE_URL}"]

viewport:
  width: 1280
  height: 800
  deviceScaleFactor: 2
  colorScheme: light

steps:
  - use: cloud-orchestrator-console-login
    with:
      portal: "${CONSOLE_URL}"
      org: "${CONSOLE_ORG}"
      username: "${CONSOLE_USER}"
      password: "${CONSOLE_PASSWORD}"

  - use: cloud-orchestrator-console-open-resource-list
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_PROJECT_PLURAL}"
  - { step: screenshot, path: project-list.png, fullPage: false }

  - use: cloud-orchestrator-console-open-resource-create
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_PROJECT_PLURAL}"
  - { step: screenshot, path: project-create.png, fullPage: false }

  # create-project.md step 1 -- the same form with the name and CIDR from the guide's snippet, so
  # the image and the YAML describe one project. Filled, never submitted.
  - { step: fill, selector: 'input[id="metadata.name"], input#name', value: "my-project" }
  - { step: fill, selector: 'input[placeholder^="CIDR range"]', value: "10.0.0.0/16" }
  - { step: screenshot, path: project-create-filled.png, fullPage: false }

  # create-project.md step 4 -- the detail page of a Ready project. Needs the seeded one.
  - use: cloud-orchestrator-console-open-resource-detail
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_PROJECT_PLURAL}"
      name: "${DOCS_PROJECT_NAME}"
  - { step: screenshot, path: project-detail.png, fullPage: false }

after:
  - { step: screenshot, when: on-failure, path: _failure-projects.png }

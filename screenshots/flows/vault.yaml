# how-to-guides/user/create-vault.md -> 3 images.
#
# Read-only: the create form is opened and named, never submitted. The list and detail
# shots need the Vault named DOCS_VAULT_NAME to exist in CONSOLE_ORG and be Ready. It is
# the organisation's own Vault, provisioned out of band and long-lived -- see "What the
# environment needs" in screenshots/README.md.
name: sco-docs-vault

requires:
  env:
    - CONSOLE_URL
    - CONSOLE_ORG
    - CONSOLE_USER
    - CONSOLE_PASSWORD
    - DOCS_VAULT_SIDEBAR_GROUP
    - DOCS_VAULT_PLURAL
    - DOCS_VAULT_NAME
  reachable: ["${CONSOLE_URL}"]

viewport:
  width: 1280
  height: 800
  deviceScaleFactor: 2
  colorScheme: light

steps:
  - use: cloud-orchestrator-console-login
    with:
      portal: "${CONSOLE_URL}"
      org: "${CONSOLE_ORG}"
      username: "${CONSOLE_USER}"
      password: "${CONSOLE_PASSWORD}"

  # Step 1, "Define a Vault Claim" -- Standard asks for a name only, the same as the
  # empty-parameters claim. Standard is the default in a fresh context.
  - use: cloud-orchestrator-console-open-resource-create
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_VAULT_PLURAL}"
  - { step: fill, selector: 'input[id="metadata.name"], input#name', value: "my-vault" }
  - { step: screenshot, path: vault-create.png, fullPage: false }

  # Step 3, "Verify the Vault" -- the list is where a reader finds the Vault to open.
  # Needs one row.
  - use: cloud-orchestrator-console-open-resource-list
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_VAULT_PLURAL}"
  - use: cloud-orchestrator-console-expand-sidebar-group
    with:
      group: "${DOCS_VAULT_SIDEBAR_GROUP}"
  - { step: screenshot, path: vault-list.png, fullPage: false }

  # Step 3 and 5 -- the detail page carries the endpoint the guide logs in to, and the
  # mesh address when the organisation runs a Mesh. Needs the seeded Vault.
  - use: cloud-orchestrator-console-open-resource-detail
    with:
      portal: "${CONSOLE_URL}"
      plural: "${DOCS_VAULT_PLURAL}"
      name: "${DOCS_VAULT_NAME}"
  # The Endpoint block is below the fold, under the conditions table; frame it.
  - { step: scroll-to, selector: 'text="Endpoint"', block: start }
  - { step: wait, ms: 500 }
  - { step: screenshot, path: vault-detail.png, fullPage: false }

after:
  - { step: screenshot, when: on-failure, path: _failure-vault.png }
